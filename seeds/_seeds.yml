version: 2

seeds:
  - name: raw_subscriptions
    description: >
      Raw subscription records as they would land from a billing system
      (Stripe, Chargebee, ...). Synthetic, generated by
      `scripts/generate_raw_subscriptions.py`. One row per subscription; a
      customer can hold several subscriptions over time (plan changes,
      reactivations) or at once (expansions).
    columns:
      - name: subscription_id
        description: Billing-system subscription identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Billing-system customer identifier.
        data_tests:
          - not_null
      - name: plan_name
        description: Plan the subscription is on.
      - name: mrr_amount
        description: Monthly recurring revenue of the subscription, in USD.
      - name: start_date
        description: First day the subscription is active.
        data_tests:
          - not_null
      - name: end_date
        description: Last day the subscription is active. Null while still active.
    data_tests:
      # Raw data is not trusted: invalid rows are dropped in staging, but we
      # still want to hear about them.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date is null or end_date >= start_date"
          config:
            severity: warn
