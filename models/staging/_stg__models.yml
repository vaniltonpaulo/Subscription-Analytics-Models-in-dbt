version: 2

models:
  - name: stg_subscriptions
    description: >
      Cleaned subscription records, one row per subscription. Rows with a
      negative MRR or an end_date before the start_date are dropped.
    columns:
      - name: subscription_id
        description: Unique subscription identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer that owns the subscription.
        data_tests:
          - not_null
      - name: plan_name
        description: Plan the subscription is on.
        data_tests:
          - accepted_values:
              arguments:
                values: ['starter', 'professional', 'enterprise']
      - name: mrr_amount
        description: Monthly recurring revenue of the subscription, in USD.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: start_date
        description: First day the subscription is active.
        data_tests:
          - not_null
      - name: end_date
        description: Last day the subscription is active. Null while still active.
