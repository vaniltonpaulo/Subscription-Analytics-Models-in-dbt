name: 'subscription_analytics_project'
version: '1.0.0'

profile: 'subscription_analytics_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Last day included in MRR reporting (YYYY-MM-DD). Null means today.
  # Pin it for reproducible numbers:
  #   dbt build --vars '{mrr_as_of_date: "2025-12-31"}'
  mrr_as_of_date: null

models:
  subscription_analytics_project:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  subscription_analytics_project:
    raw_subscriptions:
      +column_types:
        subscription_id: varchar
        customer_id: varchar
        plan_name: varchar
        mrr_amount: numeric(10,2)
        start_date: date
        end_date: date
